root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # กำหนดให้ build ไปที่ cmd/app/main.go และเซฟ binary ไปที่ tmp/main
  cmd = "go build -o ./tmp/main ./cmd/app/main.go"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  
  # นามสกุลไฟล์ที่จะจับตาดูการเปลี่ยนแปลง
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  
  # โฟลเดอร์ที่จะข้ามการตรวจจับ
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin"]
  
  # Delay การ rebuild หลังจากเซฟไฟล์ (ms)
  delay = 1000
  stop_on_error = true
  log_line_number = true

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true