# docker compose up --build
#   web dashboard  http://localhost:3000
#   gateway API    http://localhost:8081/health
# MT5 and the EA keep running on the host; the gateway reaches them at host.docker.internal.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: app.env # SYMBOLS, MT5_PORT, MT5_STREAM_PORT, MT5_TIMEOUT_SECONDS, ...
    environment:
      MT5_HOST: host.docker.internal
      GATEWAY_HTTP_PORT: "8081"
      CANDLE_DATA_DIR: /app/data/candle
      WEB_ORIGIN: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphago
      POSTGRES_PASSWORD: alphago
      POSTGRES_DB: alphago
    ports:
      - "5434:5432"
    volumes:
      - alphago_postgres_data:/var/lib/postgresql/data

volumes:
  alphago_postgres_data:
