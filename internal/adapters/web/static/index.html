<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaGo Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --line: #262c36; --text: #e6e8eb; --muted: #8b93a1;
    --up: #26a69a; --down: #ef5350; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; letter-spacing: .02em; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  .tfs { display: flex; gap: 4px; }
  .tfs button.on { border-color: var(--accent); color: var(--accent); }
  .price { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
  .price .label { color: var(--muted); margin-right: 4px; }
  .status { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--down); margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--up); }
  #legend { position: absolute; top: 8px; left: 12px; z-index: 2; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; pointer-events: none; }
  main { position: relative; flex: 1; min-height: 0; }
  #chart { position: absolute; inset: 0; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="brand">AlphaGo</span>
  <select id="symbol" aria-label="Symbol"></select>
  <div class="tfs" id="tfs"></div>
  <div class="price">
    <span><span class="label">Bid</span><span id="bid">-</span></span>
    <span><span class="label">Ask</span><span id="ask">-</span></span>
    <span><span class="label">Spread</span><span id="spread">-</span></span>
  </div>
  <div class="status">
    <span><span class="dot" id="liveDot"></span><span id="liveText">connecting</span></span>
    <span><span class="dot" id="mt5Dot"></span>MT5</span>
    <span id="backfill">backfill -</span>
  </div>
</header>
<main>
  <div id="legend"></div>
  <div id="chart"></div>
  <div id="msg"></div>
</main>
<script>
const TFS = [["M1", 60], ["M5", 300], ["M15", 900], ["M30", 1800], ["H1", 3600], ["H4", 14400], ["Daily", 86400]];
const state = { symbol: null, tf: "M15", tfSec: 900, last: null, es: null, digits: 2 };

const el = (id) => document.getElementById(id);
const chart = LightweightCharts.createChart(el("chart"), {
  layout: { background: { color: "#0f1115" }, textColor: "#8b93a1" },
  grid: { vertLines: { color: "#1c2129" }, horzLines: { color: "#1c2129" } },
  rightPriceScale: { borderColor: "#262c36" },
  timeScale: { borderColor: "#262c36", timeVisible: true, secondsVisible: false },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  autoSize: true,
});
const series = chart.addCandlestickSeries({
  upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
  wickUpColor: "#26a69a", wickDownColor: "#ef5350",
});

function fmt(v) { return v == null ? "-" : v.toFixed(state.digits); }
function showMsg(text) { el("msg").textContent = text; el("msg").style.display = text ? "flex" : "none"; }
function legend(c) {
  if (!c) { el("legend").textContent = ""; return; }
  const d = new Date(c.time * 1000).toISOString().replace("T", " ").slice(0, 16);
  el("legend").textContent = `${state.symbol} ${state.tf}  ${d} (server)  O ${fmt(c.open)}  H ${fmt(c.high)}  L ${fmt(c.low)}  C ${fmt(c.close)}`;
}
chart.subscribeCrosshairMove((p) => legend(p && p.seriesData ? p.seriesData.get(series) : state.last));

// TF buttons
for (const [name, sec] of TFS) {
  const b = document.createElement("button");
  b.textContent = name === "Daily" ? "D1" : name;
  b.dataset.tf = name;
  b.onclick = () => { state.tf = name; state.tfSec = sec; markTF(); loadCandles(); };
  el("tfs").appendChild(b);
}
function markTF() { for (const b of el("tfs").children) b.classList.toggle("on", b.dataset.tf === state.tf); }

async function loadCandles() {
  showMsg("loading...");
  state.last = null;
  try {
    const r = await fetch(`/api/candles?symbol=${encodeURIComponent(state.symbol)}&tf=${state.tf}&limit=1500`);
    const rows = await r.json();
    if (!r.ok) throw new Error(rows.error || r.statusText);
    const data = rows.map((x) => ({ time: x.t, open: x.o, high: x.h, low: x.l, close: x.c }));
    series.setData(data);
    state.last = data.length ? { ...data[data.length - 1] } : null;
    if (data.length) {
      const decimals = (n) => (String(n).split(".")[1] || "").length;
      state.digits = Math.min(5, Math.max(2, ...data.slice(-50).map((c) => decimals(c.close))));
      series.applyOptions({ priceFormat: { type: "price", precision: state.digits, minMove: Math.pow(10, -state.digits) } });
    }
    legend(state.last);
    showMsg(data.length ? "" : "no candles stored for this timeframe yet");
  } catch (e) {
    showMsg("could not load candles: " + e.message);
  }
}

// live ticks update the newest candle (or start the next one)
function onTick(t) {
  el("bid").textContent = fmt(t.bid);
  el("ask").textContent = fmt(t.ask);
  el("spread").textContent = fmt(t.ask - t.bid);
  const sec = Math.floor(t.t / 1000);
  const start = sec - (sec % state.tfSec);
  const c = state.last;
  if (c && start < c.time) return; // older than what is on the chart
  if (c && start === c.time) {
    c.high = Math.max(c.high, t.bid); c.low = Math.min(c.low, t.bid); c.close = t.bid;
  } else {
    state.last = { time: start, open: t.bid, high: t.bid, low: t.bid, close: t.bid };
  }
  series.update(state.last);
}

function connect() {
  if (state.es) state.es.close();
  const es = new EventSource(`/api/stream?symbol=${encodeURIComponent(state.symbol)}`);
  state.es = es;
  es.onopen = () => { el("liveDot").classList.add("ok"); el("liveText").textContent = "live"; };
  es.onerror = () => { el("liveDot").classList.remove("ok"); el("liveText").textContent = "reconnecting"; };
  es.onmessage = (ev) => onTick(JSON.parse(ev.data));
}

async function pollHealth() {
  try {
    const r = await fetch("/health");
    const h = await r.json();
    el("mt5Dot").classList.toggle("ok", !!h.mt5_stream);
    const b = h.backfill || {};
    const rep = (b.last || []).find((x) => x.symbol === state.symbol);
    let text = "backfill -";
    if (b.running) text = "backfill running";
    else if (rep) text = `backfill ${rep.error ? "failed" : "ok"} ${new Date(rep.finished_at).toLocaleTimeString()}`;
    el("backfill").textContent = text;
  } catch { el("mt5Dot").classList.remove("ok"); }
}

async function init() {
  const syms = await (await fetch("/api/symbols")).json();
  for (const s of syms) {
    const o = document.createElement("option");
    o.value = o.textContent = s;
    el("symbol").appendChild(o);
  }
  state.symbol = syms[0];
  el("symbol").onchange = (e) => { state.symbol = e.target.value; loadCandles(); connect(); };
  markTF();
  await loadCandles();
  connect();
  pollHealth();
  setInterval(pollHealth, 10000);
}
init().catch((e) => showMsg("dashboard failed to start: " + e.message));
</script>
</body>
</html>
